    <section class="card empty">
      <h1>VGKFIXER report viewer</h1>
      <p>VGKFIXER is a Windows utility that repairs broken Riot Vanguard installs. After a run, its <b>COPY LINK</b> button creates a link to <b>/r/</b> on this site that shows the run's results. The report is packed into the link itself, so this site never receives or stores it.</p>

  </main>
